# Pojedynczy widok do edytora YAML WIDOKU (bez klucza views:).
# Potwierdzone identyfikatory encji HA, wersja 1.4.5_1.
title: Diagnostyka techniczna
path: haier-diagnostyka
icon: mdi:heat-pump
cards:
  - type: markdown
    title: HaierPi · stan instalacji
    content: |
      {% set f = states('sensor.haierpi_compressor_fact') %}
      {% set t = states('sensor.haierpi_tao') %}
      {% set cop = states('sensor.haier_bilans_cop_dobowy') %}
      **Panel diagnostyczny 1.4.5_1** (działa również z wcześniej poprawionym Alpha13; nie potwierdza wersji głównego sterownika)

      **Sprężarka:** {% if is_number(f) %}{{ 'pracuje' if (f | float) >= 1 else 'zatrzymana' }} ({{ f }} Hz){% else %}brak aktualnego pomiaru{% endif %}

      **Temperatura na zewnątrz (HaierPi):** {% if is_number(t) %}{{ t }} °C{% else %}brak danych{% endif %}

      **COP dobowy (bilans HA):** {% if is_number(cop) %}{{ cop }}{% else %}niedostępny{% endif %}

      _Panel wyłącznie do odczytu. Nie steruje pompą. COP dobowy pochodzi z bilansu Home Assistant, a nie z nowego modułu diagnostycznego._
  - type: grid
    columns: 2
    square: false
    cards:
      - type: tile
        entity: sensor.haierpi_compressor_fact
        name: Sprężarka · rzeczywiste Hz
      - type: tile
        entity: sensor.haierpi_compressor_fset
        name: Sprężarka · zadane Hz
      - type: tile
        entity: sensor.haierpi_tao
        name: Temperatura zewnętrzna
      - type: tile
        entity: sensor.haierpi_tdef
        name: Temperatura parownika (Tdef)
      - type: tile
        entity: sensor.haier_bilans_cop_dobowy
        name: COP dobowy (bilans)
      - type: tile
        entity: sensor.haier_bilans_moc_pradu
        name: Pobór prądu · bilans HA
  - type: entities
    title: Hydraulika i praca pompy
    show_header_toggle: false
    entities:
      - entity: sensor.haierpi_twi
        name: Woda na wejściu (Twi)
      - entity: sensor.haierpi_two
        name: Woda na wyjściu (Two)
      - entity: sensor.haierpi_pump
        name: Pompa obiegowa
      - entity: sensor.haierpi_3_way_valve
        name: Zawór trójdrogowy
      - entity: sensor.haierpi_advanced_diagnostics_co_water_delta_t
        name: Różnica Two − Twi (diagnostyka)
      - entity: sensor.haierpi_active_error
        name: Aktywny błąd HaierPi
  - type: history-graph
    title: Sprężarka · zadana i rzeczywista (24 h)
    hours_to_show: 24
    refresh_interval: 120
    entities:
      - entity: sensor.haierpi_compressor_fact
        name: Rzeczywiste Hz
      - entity: sensor.haierpi_compressor_fset
        name: Zadane Hz
  - type: markdown
    title: Dostępność diagnostyki
    content: |
      {% set ids = [
        'sensor.haierpi_diagnostics_compressor_starts_today',
        'sensor.haierpi_diagnostics_compressor_run_today',
        'sensor.haierpi_diagnostics_completed_compressor_cycles_today',
        'sensor.haierpi_diagnostics_last_compressor_cycle',
        'sensor.haierpi_diagnostics_defrost_starts_today',
        'sensor.haierpi_diagnostics_defrost_run_today',
        'sensor.haierpi_diagnostics_completed_defrost_cycles_today',
        'sensor.haierpi_diagnostics_last_defrost_cycle',
        'sensor.haierpi_advanced_diagnostics_co_water_delta_t',
        'sensor.haierpi_advanced_diagnostics_refrigerant_saturation_lift',
        'sensor.haierpi_advanced_diagnostics_ambient_evaporation_approach',
        'sensor.haierpi_advanced_diagnostics_discharge_condensing_gap',
        'sensor.haierpi_advanced_diagnostics_refrigerant_pressure_delta',
        'sensor.haierpi_advanced_diagnostics_compressor_frequency_deviation'
        ] %}
      {% set ns = namespace(ok=0,missing=[]) %}
      {% for id in ids %}
        {% if is_number(states(id)) %}
          {% set ns.ok = ns.ok + 1 %}
        {% else %}
          {% set ns.missing = ns.missing + [id] %}
        {% endif %}
      {% endfor %}
      **Dostępne odczyty liczbowe: {{ ns.ok }}/14.**

      {% if ns.missing | count > 0 %}
      ⚠️ **Brak odczytów:** {{ ns.missing | join(', ') }}
      {% else %}
      Wszystkie 14 encji ma odczyt liczbowy. Nie oznacza to automatycznie, że wszystkie dane są świeże — sprawdzaj ostatnią aktualizację w szczegółach encji.
      {% endif %}

      _Zera są prawidłowymi wartościami; niedostępne encje nie są zamieniane na zero. Liczniki działają tylko w RAM na NanoPi._

  - type: markdown
    title: Podsumowanie pracy sprężarki i odszraniania
    content: |
      {% set cr = states('sensor.haierpi_diagnostics_compressor_run_today') %}
      {% set dr = states('sensor.haierpi_diagnostics_defrost_run_today') %}
      {% set lc = states('sensor.haierpi_diagnostics_last_compressor_cycle') %}
      {% set ld = states('sensor.haierpi_diagnostics_last_defrost_cycle') %}
      **Praca sprężarki dziś:** {% if is_number(cr) %}{{ (cr | float / 3600) | round(2) }} h{% else %}brak danych{% endif %}.

      **Defrost dziś:** {% if is_number(dr) %}{{ (dr | float / 60) | round(1) }} min{% else %}brak danych{% endif %}.

      **Ostatni zakończony cykl sprężarki:** {% if is_number(lc) %}{{ (lc | float / 60) | round(1) }} min{% else %}brak danych{% endif %}.

      **Ostatni zakończony defrost:** {% if is_number(ld) %}{{ (ld | float / 60) | round(1) }} min{% else %}brak danych{% endif %}.

      _Liczniki resetują się po restarcie usługi lub urządzenia; nie należy traktować ich jako pełnego bilansu dobowego, jeśli restart nastąpił w ciągu dnia._
  - type: grid
    columns: 2
    square: false
    cards:
      - type: tile
        entity: sensor.haierpi_diagnostics_compressor_starts_today
        name: Starty sprężarki dziś
      - type: tile
        entity: sensor.haierpi_diagnostics_completed_compressor_cycles_today
        name: Zakończone cykle sprężarki
      - type: tile
        entity: sensor.haierpi_diagnostics_defrost_starts_today
        name: Rozpoczęte defrosty dziś
      - type: tile
        entity: sensor.haierpi_diagnostics_completed_defrost_cycles_today
        name: Zakończone defrosty
  - type: entities
    title: Wszystkie liczniki z HaierPi (RAM)
    show_header_toggle: false
    entities:
      - entity: sensor.haierpi_diagnostics_compressor_starts_today
        name: Uruchomienia sprężarki
      - entity: sensor.haierpi_diagnostics_compressor_run_today
        name: Praca sprężarki dzisiaj (s)
      - entity: sensor.haierpi_diagnostics_completed_compressor_cycles_today
        name: Zakończone cykle sprężarki
      - entity: sensor.haierpi_diagnostics_last_compressor_cycle
        name: Ostatni zakończony cykl (s)
      - entity: sensor.haierpi_diagnostics_defrost_starts_today
        name: Uruchomienia defrostu
      - entity: sensor.haierpi_diagnostics_defrost_run_today
        name: Praca defrostu dzisiaj (s)
      - entity: sensor.haierpi_diagnostics_completed_defrost_cycles_today
        name: Zakończone defrosty
      - entity: sensor.haierpi_diagnostics_last_defrost_cycle
        name: Ostatni zakończony defrost (s)
  - type: entities
    title: Odszranianie · kontekst
    show_header_toggle: false
    entities:
      - entity: sensor.haierpi_tdef
        name: Temperatura Tdef
      - entity: sensor.haierpi_tao
        name: Temperatura otoczenia Tao
      - entity: sensor.haier_defrost_chance
        name: Defrost Chance (pomocniczy wskaźnik)
      - entity: sensor.haier_szron_stan
        name: Stan szronu (osobna logika HA)
      - entity: sensor.haier_szron_ryzyko
        name: Ryzyko szronu (osobna logika HA)
  - type: history-graph
    title: Częstotliwość sprężarki (24 h)
    hours_to_show: 24
    refresh_interval: 120
    entities:
      - entity: sensor.haierpi_compressor_fact
        name: Faktyczne Hz
      - entity: sensor.haierpi_compressor_fset
        name: Zadane Hz
  - type: history-graph
    title: Starty sprężarki i defrostów (48 h)
    hours_to_show: 48
    refresh_interval: 120
    entities:
      - entity: sensor.haierpi_diagnostics_compressor_starts_today
        name: Starty sprężarki
      - entity: sensor.haierpi_diagnostics_defrost_starts_today
        name: Defrosty
  - type: history-graph
    title: Temperatura odszraniania (24 h)
    hours_to_show: 24
    refresh_interval: 120
    entities:
      - entity: sensor.haierpi_tao
        name: Tao
      - entity: sensor.haierpi_tdef
        name: Tdef
  - type: markdown
    content: |
      _Defrost Chance, Szron (stan) i Szron (ryzyko) to niezależne wskaźniki Home Assistant, a nie potwierdzony stan defrostu. Nie wyciągaj z ich wartości wniosku, że odszranianie rzeczywiście trwa._

  - type: markdown
    title: Obieg chłodniczy · interpretacja
    content: |
      Sześć wskaźników obiegu pochodzi z **`haierpi-circuit`** i jest obliczanych z odczytów HaierPi. Różnice temperatur i ciśnień służą do diagnostyki; **nie są to alarmy producenta ani obliczony COP**.

      Gdy sprężarka jest wyłączona, część wskaźników może być bliska zeru. Dane z osobnych encji MQTT mogą pochodzić z różnych chwil; nie porównuj ich bez uwzględnienia czasu aktualizacji.
  - type: entities
    title: Sześć obliczanych parametrów 1.4.5_1
    show_header_toggle: false
    entities:
      - entity: sensor.haierpi_advanced_diagnostics_co_water_delta_t
        name: Różnica temperatur wody Two − Twi
      - entity: sensor.haierpi_advanced_diagnostics_refrigerant_saturation_lift
        name: Różnica temperatur nasycenia czynnika
      - entity: sensor.haierpi_advanced_diagnostics_ambient_evaporation_approach
        name: Powietrze − temperatura parowania
      - entity: sensor.haierpi_advanced_diagnostics_discharge_condensing_gap
        name: Tłoczenie − temperatura skraplania
      - entity: sensor.haierpi_advanced_diagnostics_refrigerant_pressure_delta
        name: Różnica ciśnień Pd − Ps (MPa)
      - entity: sensor.haierpi_advanced_diagnostics_compressor_frequency_deviation
        name: Odchylenie częstotliwości fset − fact
  - type: entities
    title: Temperatury źródłowe HaierPi
    show_header_toggle: false
    entities:
      - entity: sensor.haierpi_twi
        name: Woda z instalacji (Twi)
      - entity: sensor.haierpi_two
        name: Woda do instalacji (Two)
      - entity: sensor.haierpi_tao
        name: Powietrze zewnętrzne (Tao)
      - entity: sensor.haierpi_tdef
        name: Parownik (Tdef)
      - entity: sensor.haierpi_tsatpsact
        name: Nasycenie parowania (TsatPs act)
      - entity: sensor.haierpi_tsatpdact
        name: Nasycenie skraplania (TsatPd act)
      - entity: sensor.haierpi_td
        name: Tłoczenie sprężarki (Td)
      - entity: sensor.haierpi_ts
        name: Temperatura Ts
      - entity: sensor.haierpi_superheat
        name: Przegrzanie (Superheat)
      - entity: sensor.haierpi_subcooling
        name: Dochłodzenie (Subcooling)
  - type: entities
    title: Ciśnienia, sprężarka, zawór
    show_header_toggle: false
    entities:
      - entity: sensor.haierpi_pdact
        name: Ciśnienie wysokie Pd act (bar)
      - entity: sensor.haierpi_psact
        name: Ciśnienie niskie Ps act (bar)
      - entity: sensor.haierpi_eev_level
        name: Zawór rozprężny EEV
      - entity: sensor.haierpi_compressor_fact
        name: Faktyczna częstotliwość
      - entity: sensor.haierpi_compressor_fset
        name: Zadana częstotliwość
