  - type: markdown
    title: Bilans energii — istniejące sensory Home Assistant
    content: |
      Dane w tej zakładce pochodzą z **Twoich szablonów/bilansu w Home Assistant**, a nie z naszych dwóch modułów MQTT. Wartości energetyczne i COP nie są wyznaczane przez nową diagnostykę obiegu.

      **`sensor.haier_cop_chwilowy` jest obecnie niedostępny** i celowo nie został użyty. COP dobowy ma inny okres uśredniania i nie powinien być podpisywany jako „COP chwilowy”.
  - type: grid
    columns: 2
    square: false
    cards:
      - type: tile
        entity: sensor.haier_bilans_cop_dobowy
        name: COP dobowy
      - type: tile
        entity: sensor.haier_bilans_prad_dzis
        name: Prąd dziś · bilans
      - type: tile
        entity: sensor.haier_bilans_cieplo_netto_dzis
        name: Ciepło netto dziś
      - type: tile
        entity: sensor.haier_bilans_cieplo_odebrane_dzis
        name: Energia odebrana w defroście
      - type: tile
        entity: sensor.haier_bilans_moc_pradu
        name: Pobór elektryczny
      - type: tile
        entity: sensor.haier_bilans_moc_grzania
        name: Moc grzania
  - type: entities
