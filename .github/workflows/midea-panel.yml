name: Midea dashboard tests
on:
  push:
    paths:
      - 'home_assistant/update-midea-panel.py'
      - 'tests/test_midea_panel.py'
      - '.github/workflows/midea-panel.yml'
  pull_request:
    paths:
      - 'home_assistant/update-midea-panel.py'
      - 'tests/test_midea_panel.py'
      - '.github/workflows/midea-panel.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_midea_panel.py -v
