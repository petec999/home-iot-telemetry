name: Haier heater dashboard tests
on:
  push:
    paths:
      - 'home_assistant/update-haier-heater-panel.py'
      - 'tests/test_haier_heater_panel.py'
      - '.github/workflows/haier-heater-panel.yml'
  pull_request:
    paths:
      - 'home_assistant/update-haier-heater-panel.py'
      - 'tests/test_haier_heater_panel.py'
      - '.github/workflows/haier-heater-panel.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_haier_heater_panel.py -v
